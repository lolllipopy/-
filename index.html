<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Кинозалом</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        .video-container { width: 100%; height: 100%; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        .click-blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); z-index: 999; display: none; }
        
        /* Удобная панель управления для Админа сверху */
        #admin-panel {
            position: absolute; top: 15px; left: 15px; 
            background: rgba(20, 20, 20, 0.9); border: 1px solid #333;
            color: #fff; padding: 15px; border-radius: 8px; z-index: 1000; 
            display: none; font-size: 13px; width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        #admin-panel input { 
            width: 100%; background: #111; color: #fff; 
            border: 1px solid #444; padding: 6px; border-radius: 4px; 
            margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;
        }
        #admin-panel button {
            background: #2563eb; color: #fff; border: none; 
            padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #admin-panel button:hover { background: #1d4ed8; }
        .panel-section { margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 10px; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="panel-section">
        <strong>Панель Управления</strong>
    </div>
    <div class="panel-section">
        <label>1. Ссылка для ваших зрителей:</label>
        <input type="text" id="share-url" readonly onclick="this.select()">
    </div>
    <div>
        <label>2. Поставить новую HLS (.m3u8) ссылку:</label>
        <input type="text" id="hls-input" placeholder="https://site.com/stream.m3u8">
        <button onclick="changeStream()">Обновить поток у всех</button>
    </div>
</div>

<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // Генерация постоянного уникального ID комнаты на основе вашего домена GitHub
    const ROOM_ID = 'room_' + btoa(window.location.hostname).replace(/[^a-zA-Z0-9]/g, '').substring(0, 12).toLowerCase();

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('role') === 'admin';

    // Базовый запуск пустого плеера
    const player = videojs('my-player', { controls: true, autoplay: false, preload: 'auto' });

    player.ready(function() {
        if (!isAdmin) {
            document.getElementById('blocker').style.display = 'block';
            if (player.controlBar.playToggle) player.controlBar.playToggle.hide();
            if (player.controlBar.progressControl) player.controlBar.progressControl.hide();
            window.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); }, true);
        }
    });

    let connections = [];
    let currentHlsLink = ""; // Переменная для хранения текущей ссылки

    // Функция смены потока (вызывается кнопкой из UI)
    function changeStream(newUrl, isRemote = false) {
        const url = newUrl || document.getElementById('hls-input').value.trim();
        if (!url) return;

        currentHlsLink = url;
        
        // Меняем видео в плеере
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play().catch(() => {}); // Пытаемся запустить

        // Если это сделал админ, отправляем ссылку всем подключенным зрителям
        if (isAdmin && !isRemote) {
            connections.forEach(c => c.send({ action: 'change_src', url: url }));
        }
    }

    if (isAdmin) {
        document.getElementById('admin-panel').style.display = 'block';
        
        // Создаем постоянную комнату
        const peer = new Peer(ROOM_ID);

        peer.on('open', () => {
            // Формируем постоянную красивую ссылку для зрителей
            const shareUrl = window.location.origin + window.location.pathname;
            document.getElementById('share-url').value = shareUrl;
        });

        peer.on('connection', conn => {
            connections.push(conn);
            
            // Если зритель зашел, а видео уже идет — сразу передаем ему текущую ссылку и таймкод
            setTimeout(() => {
                if (currentHlsLink) {
                    conn.send({ action: 'change_src', url: currentHlsLink });
                    setTimeout(() => {
                        conn.send({ action: 'seek', time: player.currentTime() });
                        if (!player.paused()) conn.send({ action: 'play' });
                    }, 1000);
                }
            }, 1000);
        });

        // Отправка базовых команд управления
        // Стало (умная синхронизация при перемотке):
player.on('play', () => { 
    connections.forEach(c => c.send({ action: 'play' })); 
});

player.on('pause', () => { 
    connections.forEach(c => c.send({ action: 'pause' })); 
});

player.on('seeking', () => { 
    // При перемотке принудительно ставим зрителей на паузу, чтобы они не пытались воспроизводить кашу
    connections.forEach(c => c.send({ action: 'pause' }));
    connections.forEach(c => c.send({ action: 'seek', time: player.currentTime() })); 
});

player.on('seeked', () => {
    // Как только вы закончили мотать и у вас видео готово, даем команду "старт" зрителям спустя небольшую паузу
    setTimeout(() => {
        connections.forEach(c => c.send({ action: 'seek', time: player.currentTime() }));
        if (!player.paused()) {
            connections.forEach(c => c.send({ action: 'play' }));
        }
    }, 1000); // 1 секунда задержки, чтобы плееры зрителей успели подгрузить новые данные
});

    } else {
        // Логика ЗРИТЕЛЯ (Автоподключение к вашей постоянной комнате)
        const peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(ROOM_ID);
            
            conn.on('data', data => {
                if (data.action === 'change_src') {
                    changeStream(data.url, true);
                } else if (data.action === 'play') {
                    player.play();
                } else if (data.action === 'pause') {
                    player.pause();
                } else if (data.action === 'seek') {
                    if (Math.abs(player.currentTime() - data.time) > 2) {
                        player.currentTime(data.time);
                    }
                }
            });
        });
    }
</script>

</body>
</html>
