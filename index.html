<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный Плеер</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            height: 100%;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        /* Щит для зрителей */
        .click-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
    // === ВСТАВЬТЕ ССЫЛКУ СЮДА ===
    const HLS_LINK = "https://vdbmate.org/14f1a60d66d41047774e17105dd7c712:2026060917:S05xQkplNGp4N1lZOWlTeGlWd2FreVlPeVpVVWtTWExjL1pGSnhqY21BZUUrOEdxVDFvSjdabW00cmVaRFRpYU1XOWUxdk1hR1gyejBBLzg5MFhqOEE9PQ==/1/4/7/4/5/2/3/i0er9.mp4:hls:manifest.m3u8"; 
    // ===========================

    // Определяем роль (Админ или Зритель)
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('role') === 'admin';

    // Настройка интерфейса плеера
    const playerOptions = {
        controls: true, // Включаем кнопки по умолчанию
        autoplay: false,
        preload: 'auto',
        fluid: false
    };

    // Инициализируем плеер
    const player = videojs('my-player', playerOptions);

    // Загружаем вашу HLS ссылку
    player.src({
        src: HLS_LINK,
        type: 'application/x-mpegURL'
    });

    // Логика ограничений
    player.ready(function() {
        if (!isAdmin) {
            // ЗРИТЕЛЬ: Включаем физический щит от кликов
            document.getElementById('blocker').style.display = 'block';
            
            // Скрываем кнопку паузы и временную шкалу из панели управления плеера
            if (player.controlBar.playToggle) player.controlBar.playToggle.hide();
            if (player.controlBar.progressControl) player.controlBar.progressControl.hide();
            
            // Блокируем пробел
            window.addEventListener('keydown', function(e) {
                if (e.code === 'Space') e.preventDefault();
            }, true);
        }
    });
</script>

</body>
</html>
