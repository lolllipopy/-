<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кино</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; }
        #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; background: rgba(0,0,0,0); }
        #unmuteBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; z-index: 20; cursor: pointer; display: block; 
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="blocker"></div>
    <button id="unmuteBtn">ВКЛЮЧИТЬ ЗВУК</button>
    <!-- Видео ОБЯЗАТЕЛЬНО muted для работы автоплея -->
    <video id="video" playsinline muted></video>
</div>

<script>
// ВАЖНО: Укажите здесь ID вашей админки
const ROOM_ID = 'pizba'; 

let hls;
let currentHlsLink = null;
let isAutonomous = true; 
let peerConn = null;

const video = document.getElementById('video');
const unmuteBtn = document.getElementById('unmuteBtn');

function lockViewerControls() { 
    document.getElementById('blocker').style.display = 'block'; 
    video.controls = false; 
}

function unlockViewerControls() { 
    document.getElementById('blocker').style.display = 'none'; 
    video.controls = true; 
}

// 1. ИСПРАВЛЕНИЕ: Кнопка звука теперь реально нужна
unmuteBtn.addEventListener('click', () => { 
    video.muted = false; 
    video.volume = 1;
    unmuteBtn.style.display = 'none';
});

function changeStream(url, forcePlay = true) { 
    currentHlsLink = url; 
    video.pause(); 

    if (hls) { 
        hls.destroy(); 
        hls = null; 
    } 

    video.removeAttribute('src'); 
    video.load();

    if (Hls.isSupported()) { 
        hls = new Hls({ debug: false, lowLatencyMode: true }); 
        hls.loadSource(url); 
        hls.attachMedia(video); 

        hls.on(Hls.Events.MANIFEST_PARSED, () => { 
            // Видео всегда стартует muted, чтобы автоплей не блокировался
            video.muted = true; 
            if (forcePlay) {
                video.play().catch(() => {
                    unmuteBtn.style.display = 'block';
                });
            }
        }); 

        hls.on(Hls.Events.ERROR, (event, data) => { 
            if (data.fatal) { 
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                else restartCurrentStream();
            } 
        }); 
    }
}

// 2. ИСПРАВЛЕНИЕ: Функция перезапуска теперь имеет тело (из ваших источников [3])
function restartCurrentStream() { 
    if (!isAutonomous || !currentHlsLink) return; 
    console.log("Восстановление потока...");
    changeStream(currentHlsLink, true);
}

// Контроль зависаний [3]
setInterval(() => { 
    if (isAutonomous && currentHlsLink && !video.paused && video.readyState < 3) { 
        restartCurrentStream(); 
    } 
}, 10000);

// Инициализация связи
lockViewerControls(); 
const peer = new Peer(); 

peer.on('open', () => { 
    peerConn = peer.connect(ROOM_ID, { reliable: true }); 
    
    peerConn.on('open', () => { 
        console.log('Connected to admin'); 
    }); 

    // 3. ИСПРАВЛЕНИЕ: Теперь данные от админа управляют плеером
    peerConn.on('data', data => { 
        if (isAutonomous) { 
            isAutonomous = false; 
            lockViewerControls(); 
        }

        // Если админ прислал новую ссылку — меняем поток
        if (data && data.url) {
            console.log("Команда от админа: новая ссылка", data.url);
            changeStream(data.url);
        }
    });
});

peer.on('error', () => { 
    isAutonomous = true; 
    unlockViewerControls(); 
    if (currentHlsLink) restartCurrentStream();
}); 
</script>
</body>
</html>
