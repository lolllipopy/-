<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный Кинозал</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        .video-container { width: 100%; height: 100%; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        .click-blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); z-index: 999; display: none; }
        
        /* Информационная плашка для админа */
        #admin-panel {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); 
            color: #fff; padding: 10px; border-radius: 5px; z-index: 1000; display: none; font-size: 12px;
        }
        #admin-panel input { width: 250px; background: #222; color: #fff; border: 1px solid #444; padding: 3px; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div>Режим администратора</div>
    <label>Ссылка для зрителей (скопируйте):</label><br>
    <input type="text" id="share-url" readonly onclick="this.select()">
</div>

<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // === ВСТАВЬТЕ ССЫЛКУ СЮДА ===
    const HLS_LINK = "https://vdbmate.org/14f1a60d66d41047774e17105dd7c712:2026060917:S05xQkplNGp4N1lZOWlTeGlWd2FreVlPeVpVVWtTWExjL1pGSnhqY21BZUUrOEdxVDFvSjdabW00cmVaRFRpYU1XOWUxdk1hR1gyejBBLzg5MFhqOEE9PQ==/1/4/7/4/5/2/3/i0er9.mp4:hls:manifest.m3u8"; 
    // ===========================

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('role') === 'admin';
    const hostId = urlParams.get('room'); // ID комнаты для зрителя

    // Инициализация плеера
    const player = videojs('my-player', { controls: true, autoplay: false, preload: 'auto' });
    player.src({ src: HLS_LINK, type: 'application/x-mpegURL' });

    // Настройка прав
    player.ready(function() {
        if (!isAdmin) {
            document.getElementById('blocker').style.display = 'block';
            if (player.controlBar.playToggle) player.controlBar.playToggle.hide();
            if (player.controlBar.progressControl) player.controlBar.progressControl.hide();
            window.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); }, true);
        }
    });

    // === СИСТЕМА СИНХРОНИЗАЦИИ (PEERJS) ===
    let connections = [];

    if (isAdmin) {
        document.getElementById('admin-panel').style.display = 'block';
        
        // Создаем случайный ID комнаты на основе времени
        const roomId = 'room_' + Math.floor(Math.random() * 900000 + 100000);
        const peer = new Peer(roomId);

        peer.on('open', () => {
            const shareUrl = window.location.origin + window.location.pathname + '?room=' + roomId;
            document.getElementById('share-url').value = shareUrl;
        });

        // Слушаем подключение зрителей
        peer.on('connection', conn => {
            connections.push(conn);
            // При подключении нового зрителя сразу отправляем ему текущее время видео
            setTimeout(() => {
                conn.send({ action: 'seek', time: player.currentTime() });
                if (!player.paused()) conn.send({ action: 'play' });
            }, 1000);
        });

        // Отправка команд всем зрителям при действиях админа
        player.on('play', () => { connections.forEach(c => c.send({ action: 'play' })); });
        player.on('pause', () => { connections.forEach(c => c.send({ action: 'pause' })); });
        player.on('seeking', () => { connections.forEach(c => c.send({ action: 'seek', time: player.currentTime() })); });

    } else if (hostId) {
        // Логика для ЗРИТЕЛЯ: подключаемся к админу
        const peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(hostId);
            
            conn.on('data', data => {
                if (data.action === 'play') {
                    player.play();
                } else if (data.action === 'pause') {
                    player.pause();
                } else if (data.action === 'seek') {
                    // Избегаем зацикливания перемещения
                    if (Math.abs(player.currentTime() - data.time) > 2) {
                        player.currentTime(data.time);
                    }
                }
            });
        });
    }
</script>

</body>
</html>
