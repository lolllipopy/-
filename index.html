<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пизба 2</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;background-color:#000;overflow:hidden;}
.video-container{width:100%;height:100%;position:relative}
#my-player{width:100%;height:100%;display:block;object-fit:contain}
.click-blocker{position:absolute;top:0;left:0;width:100%;height:100%;z-index:999;display:none}
/* Оверлей для первого тапа */
#tap-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 24px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <div id="tap-overlay">НАЖМИ ЧТОБЫ ЗАПУСТИТЬ</div>
    <video id="my-player" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const ROOM_ID = 'pizba';
const video = document.getElementById('my-player');
const overlay = document.getElementById('tap-overlay');
let hls = null;
let currentHlsLink = "";
let lastPingTime = Date.now();
let isAutonomous = false;
let isReady = false; // Флаг готовности после первого тапа

function lockViewerControls() {
    document.getElementById('blocker').style.display = 'block';
    video.controls = false;
}

function unlockViewerControls() {
    document.getElementById('blocker').style.display = 'none';
    video.controls = true;
}

// Инициализация по первому тапу (обязательно для мобильных)
overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
    isReady = true;
    // Если ссылка уже есть, пробуем запустить
    if (currentHlsLink) {
        playVideo();
    }
});

function playVideo() {
    if (!isReady) return;
    var promise = video.play();
    if (promise !== undefined) {
        promise.catch(error => {
            console.log("Play failed:", error);
            // Если не вышло, возможно звук мешает, пробуем muted
            if (video.muted === false) {
                video.muted = true;
                video.play().catch(() => {});
            }
        });
    }
}

function changeStream(url, forcePlay) {
    currentHlsLink = url;
    
    // Сброс
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.pause();
    video.removeAttribute('src');
    video.load();

    if (Hls.isSupported()) {
        hls = new Hls({
            debug: false,
            maxBufferLength: 30,
            maxMaxBufferLength: 60
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            if (forcePlay && isReady) playVideo();
        });
        
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
               switch (data.type) {
               case Hls.ErrorTypes.NETWORK_ERROR:
                  hls.startLoad();
                  break;
               case Hls.ErrorTypes.MEDIA_ERROR:
                  hls.recoverMediaError();
                  break;
               default:
                  hls.destroy();
                  break;
               }
            }
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // iOS Safari
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
            if (forcePlay && isReady) playVideo();
        }, { once: true });
    }
}

setInterval(() => {
    if (currentHlsLink && !isAutonomous && (Date.now() - lastPingTime > 4000)) {
        isAutonomous = true;
        unlockViewerControls();
    }
}, 1000);

lockViewerControls();

const peer = new Peer();
peer.on('open', () => {
    const conn = peer.connect(ROOM_ID);
    conn.on('data', data => {
        if (data.action === 'ping') {
            lastPingTime = Date.now();
            if (isAutonomous) { isAutonomous = false; lockViewerControls(); }
        }
        else if (data.action === 'sync_init' || data.action === 'change_src') {
            changeStream(data.url, data.forcePlay || data.isPlaying);
            if (data.time) video.currentTime = data.time;
        }
        else if (data.action === 'seek_sync') {
            if (!isAutonomous) {
                video.currentTime = data.time;
                if (data.isPlaying && isReady) playVideo(); 
                else video.pause();
            }
        }
        else if (data.action === 'play') { 
            if (!isAutonomous && currentHlsLink && isReady) playVideo(); 
        }
        else if (data.action === 'pause') { 
            if (!isAutonomous) video.pause(); 
        }
        else if (data.action === 'admin_away') { isAutonomous = true; unlockViewerControls(); }
    });
    conn.on('close', () => { isAutonomous = true; unlockViewerControls(); });
    conn.on('error', () => { isAutonomous = true; unlockViewerControls(); });
});
</script>
</body>
</html>
