<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Кинозалом</title>
    
    <!-- Стили Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        .video-container { width: 100%; height: 100%; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        .click-blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); z-index: 999; display: none; }
        
        /* Панель Управления для Администратора */
        #admin-panel {
            position: absolute; top: 15px; left: 15px; 
            background: rgba(20, 20, 20, 0.9); border: 1px solid #333;
            color: #fff; padding: 15px; border-radius: 8px; z-index: 1000; 
            display: none; font-size: 13px; width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        #admin-panel input { 
            width: 100%; background: #111; color: #fff; 
            border: 1px solid #444; padding: 6px; border-radius: 4px; 
            margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;
        }
        #admin-panel button {
            background: #2563eb; color: #fff; border: none; 
            padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #admin-panel button:hover { background: #1d4ed8; }
        .panel-section { margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 10px; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="panel-section">
        <strong>Панель Управления (Защищено)</strong>
    </div>
    <div class="panel-section">
        <label>1. Постоянная ссылка для зрителей:</label>
        <input type="text" id="share-url" readonly onclick="this.select()">
    </div>
    <div>
        <label>2. Поставить новую HLS (.m3u8) ссылку:</label>
        <input type="text" id="hls-input" placeholder="Вставьте ссылку сюда">
        <button onclick="changeStream()">Обновить поток у всех</button>
    </div>
</div>

<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<!-- Скрипты Video.js и P2P сети -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // === НАСТРОЙКА БЕЗОПАСНОСТИ ===
    const SECRET_KEY = 'zCNf4deVHt1IJnZXQxvd'; 

    const ROOM_ID = 'room_' + btoa(window.location.hostname).replace(/[^a-zA-Z0-9]/g, '').substring(0, 12).toLowerCase();
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('key') === SECRET_KEY;

    // Запуск Video.js с ограничением кэша оперативной памяти
    const player = videojs('my-player', { 
        controls: true, 
        autoplay: false, 
        preload: 'auto',
        html5: {
            hls: {
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                backBufferLength: 15,
                maxBufferSize: 30 * 1024 * 1024
            }
        }
    });

    player.ready(function() {
        if (!isAdmin) {
            lockViewerControls();
        }
    });

    // Блокировка управления (Когда админ СЕТИ)
    function lockViewerControls() {
        document.getElementById('blocker').style.display = 'block'; // Блокируем клики по экрану
        if (player.controlBar.playToggle) player.controlBar.playToggle.hide(); // Прячем Плей/Паузу
        if (player.controlBar.progressControl) player.controlBar.progressControl.hide(); // Прячем перемотку
        window.addEventListener('keydown', preventSpace, true); // Запрещаем Пробел
    }

    // Полная разблокировка управления (Когда админ УШЕЛ)
    function unlockViewerControls() {
        document.getElementById('blocker').style.display = 'none'; // Разрешаем клики по экрану
        if (player.controlBar.playToggle) player.controlBar.playToggle.show(); // Показываем Плей/Паузу
        if (player.controlBar.progressControl) player.controlBar.progressControl.show(); // Показываем перемотку
        window.removeEventListener('keydown', preventSpace, true); // Разрешаем Пробел
    }

    function preventSpace(e) { if (e.code === 'Space') e.preventDefault(); }

    let connections = [];
    let currentHlsLink = "";

    function changeStream(newUrl, isRemote = false) {
        const url = newUrl || document.getElementById('hls-input').value.trim();
        if (!url) return;

        currentHlsLink = url;
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play().catch(() => {});

        if (isAdmin && !isRemote) {
            connections.forEach(c => c.send({ action: 'change_src', url: url }));
        }
    }

    // === СИСТЕМА СИНХРОНИЗАЦИИ (PEERJS) ===
    if (isAdmin) {
        document.getElementById('admin-panel').style.display = 'block';
        const peer = new Peer(ROOM_ID);

        peer.on('open', () => {
            document.getElementById('share-url').value = window.location.origin + window.location.pathname;
        });

        peer.on('connection', conn => {
            connections.push(conn);
            
            // Отправляем ежесекундный сигнал присутствия
            const pingInterval = setInterval(() => {
                if (conn.open) { conn.send({ action: 'ping' }); } else { clearInterval(pingInterval); }
            }, 1000);

            setTimeout(() => {
                if (currentHlsLink) {
                    conn.send({ action: 'change_src', url: currentHlsLink });
                    setTimeout(() => {
                        conn.send({ action: 'seek', time: player.currentTime() });
                        if (!player.paused()) conn.send({ action: 'play' });
                    }, 1500);
                }
            }, 1000);
        });

        player.on('play', () => { connections.forEach(c => c.send({ action: 'play' })); });
        player.on('pause', () => { connections.forEach(c => c.send({ action: 'pause' })); });
        
        player.on('seeking', () => { 
            connections.forEach(c => c.send({ action: 'pause' }));
            connections.forEach(c => c.send({ action: 'seek', time: player.currentTime() })); 
        });
        
        player.on('seeked', () => {
            setTimeout(() => {
                connections.forEach(c => c.send({ action: 'seek', time: player.currentTime() }));
                if (!player.paused()) connections.forEach(c => c.send({ action: 'play' }));
            }, 1000);
        });

        window.addEventListener('beforeunload', () => {
            connections.forEach(c => c.send({ action: 'admin_away' }));
        });

    } else {
        // ЛОГИКА ЗРИТЕЛЯ
        const peer = new Peer();
        let lastPingTime = Date.now();
        let isAutonomous = false;

        // Следим за тем, на связи ли админ
        setInterval(() => {
            if (currentHlsLink && !isAutonomous && (Date.now() - lastPingTime > 4000)) {
                isAutonomous = true;
                unlockViewerControls(); // Админ пропал -> даем зрителям полную свободу
            }
        }, 1000);

        peer.on('open', () => {
            const conn = peer.connect(ROOM_ID);
            
            conn.on('data', data => {
                if (data.action === 'ping') {
                    lastPingTime = Date.now();
                    if (isAutonomous) { 
                        isAutonomous = false; 
                        lockViewerControls(); // Админ вернулся -> снова забираем управление
                    }
                } else if (data.action === 'change_src') {
                    changeStream(data.url, true);
                } else if (data.action === 'play') {
                    if (!isAutonomous && currentHlsLink) player.play().catch(() => {});
                } else if (data.action === 'pause') {
                    if (!isAutonomous) player.pause();
                } else if (data.action === 'seek') {
                    if (!isAutonomous && Math.abs(player.currentTime() - data.time) > 2) {
                        player.currentTime(data.time);
                    }
                } else if (data.action === 'admin_away') {
                    isAutonomous = true;
                    unlockViewerControls(); // Админ закрыл вкладку -> даем зрителям полную свободу
                }
            });

            conn.on('close', () => { isAutonomous = true; unlockViewerControls(); });
            conn.on('error', () => { isAutonomous = true; unlockViewerControls(); });
        });
    }
</script>

</body>
</html>
