<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пизба 2</title>
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;background-color:#000;overflow:hidden;}
        .video-container{width:100%;height:100%;position:relative}
        #my-player{width:100%;height:100%;display:block}
        .click-blocker{position:absolute;top:0;left:0;width:100%;height:calc(100% - 50px);z-index:999;display:none}
    </style>
</head>
<body>
<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" controls></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const ROOM_ID = 'pizba';
    const video = document.getElementById('my-player');
    let hls = new Hls({ debug: false });
    let currentHlsLink = "";
    let lastPingTime = Date.now();
    let isAutonomous = false;

    function lockViewerControls() { document.getElementById('blocker').style.display = 'block'; video.controls = false; }
    function unlockViewerControls() { document.getElementById('blocker').style.display = 'none'; video.controls = true; }

    const peer = new Peer();
    peer.on('open', () => {
        const conn = peer.connect(ROOM_ID);
        conn.on('data', data => {
            if (data.action === 'ping') { lastPingTime = Date.now(); if (isAutonomous) { isAutonomous = false; lockViewerControls(); } }
            else if (data.action === 'change_src') { hls.loadSource(data.url); hls.attachMedia(video); video.play(); }
            else if (data.action === 'play') { if (!isAutonomous) video.play(); }
            else if (data.action === 'pause') { if (!isAutonomous) video.pause(); }
            else if (data.action === 'admin_away') { isAutonomous = true; unlockViewerControls(); }
            // ДОБАВЛЕНО:
            else if (data.action === 'update_info') { document.title = data.title; }
        });
    });
</script>
</body>
</html>
