<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пизба</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;background-color:#000;overflow:hidden;}
        .video-container{width:100%;height:100%;position:relative}
        .video-js{width:100%!important;height:100%!important}
        .click-blocker{position:absolute;top:0;left:0;width:100%;height:calc(100% - 50px);z-index:999;display:none}
    </style>
</head>
<body>
<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const ROOM_ID = 'pizba'; 
    const player = videojs('my-player', { 
        controls: true, autoplay: false, preload: 'auto',
        html5: { hls: { maxBufferLength: 30, maxMaxBufferLength: 60, backBufferLength: 15, maxBufferSize: 30 * 1024 * 1024 } }
    });

    let currentHlsLink = "";
    let lastPingTime = Date.now();
    let isAutonomous = false;

    function lockViewerControls() {
        document.getElementById('blocker').style.display = 'block';
        if (player.controlBar.playToggle) player.controlBar.playToggle.hide();
        if (player.controlBar.progressControl) player.controlBar.progressControl.hide();
        window.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); }, true);
    }

    function unlockViewerControls() {
        document.getElementById('blocker').style.display = 'none';
        if (player.controlBar.playToggle) player.controlBar.playToggle.show();
        if (player.controlBar.progressControl) player.controlBar.progressControl.show();
    }

	function changeStream(url, forcePlay) {
    currentHlsLink = url;
    player.src({ src: url, type: 'application/x-mpegURL' });
    
    // ДОБАВЬТЕ ЭТУ СТРОКУ:
    // Она удаляет атрибут src из видео-тега в DOM, чтобы его не было видно через span
    document.querySelector('video').removeAttribute('src'); 
    
    if (forcePlay) player.play().catch(() => {}); else player.pause();
	}
	
    setInterval(() => {
        if (currentHlsLink && !isAutonomous && (Date.now() - lastPingTime > 4000)) {
            isAutonomous = true;
            unlockViewerControls(); 
        }
    }, 1000);

    lockViewerControls();
    
    const peer = new Peer();
    peer.on('open', () => {
        const conn = peer.connect(ROOM_ID);
        conn.on('data', data => {
            if (data.action === 'ping') {
                lastPingTime = Date.now();
                if (isAutonomous) { isAutonomous = false; lockViewerControls(); }
            } 
            else if (data.action === 'sync_init' || data.action === 'change_src') {
                changeStream(data.url, data.forcePlay || data.isPlaying);
                if (data.time) player.currentTime(data.time);
            } 
            else if (data.action === 'seek_sync') {
                if (!isAutonomous) {
                    player.currentTime(data.time);
                    if (data.isPlaying) player.play().catch(() => {}); else player.pause();
                }
            } 
            else if (data.action === 'play') { if (!isAutonomous && currentHlsLink) player.play().catch(() => {}); } 
            else if (data.action === 'pause') { if (!isAutonomous) player.pause(); } 
            else if (data.action === 'admin_away') { isAutonomous = true; unlockViewerControls(); }
        });
        conn.on('close', () => { isAutonomous = true; unlockViewerControls(); });
        conn.on('error', () => { isAutonomous = true; unlockViewerControls(); });
    });
</script>
</body>
</html>
