<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пизба 2</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        .video-container { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; }
        #my-player { width: 100%; flex-grow: 1; display: block; }
        .click-blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); z-index: 999; display: none; }
        
        .info-panel { display: flex; padding: 15px; background: #111; color: #fff; align-items: center; border-bottom: 1px solid #333; }
        #poster { width: 80px; height: 80px; object-fit: cover; margin-right: 15px; border-radius: 4px; background: #222; }
        .text-content { display: flex; flex-direction: column; }
        #stream-title { margin: 0; font-size: 18px; }
        #stream-desc { margin: 5px 0 0 0; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

<div class="video-container">
    <div class="info-panel">
        <img id="poster" src="" alt="Постер">
        <div class="text-content">
            <h1 id="stream-title">Заголовок</h1>
            <p id="stream-desc">Описание</p>
        </div>
    </div>
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" controls></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const ROOM_ID = 'pizba';
    const video = document.getElementById('my-player');
    let hls = new Hls({ debug: false, maxBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 20 * 1024 * 1024 });
    let currentHlsLink = "";
    let lastPingTime = Date.now();
    let isAutonomous = false;

    function lockViewerControls() {
        document.getElementById('blocker').style.display = 'block';
        video.controls = false;
    }

    function unlockViewerControls() {
        document.getElementById('blocker').style.display = 'none';
        video.controls = true;
    }

    function updateInfo(title, desc, posterUrl) {
        document.getElementById('stream-title').innerText = title;
        document.getElementById('stream-desc').innerText = desc;
        document.getElementById('poster').src = posterUrl;
    }

    function changeStream(url, forcePlay) {
        currentHlsLink = url;
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
        if (forcePlay) video.play().catch(() => {}); else video.pause();
    }

    window.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); }, true);
    
    setInterval(() => {
        if (currentHlsLink && !isAutonomous && (Date.now() - lastPingTime > 4000)) {
            isAutonomous = true;
            unlockViewerControls(); 
        }
    }, 1000);

    lockViewerControls();
    
    const peer = new Peer();
    peer.on('open', () => {
        const conn = peer.connect(ROOM_ID);
        conn.on('data', data => {
            if (data.action === 'ping') {
                lastPingTime = Date.now();
                if (isAutonomous) { isAutonomous = false; lockViewerControls(); }
            } else if (data.action === 'sync_init' || data.action === 'change_src') {
                changeStream(data.url, data.forcePlay || data.isPlaying);
                if (data.time) video.currentTime = data.time;
            } else if (data.action === 'seek_sync') {
                if (!isAutonomous) {
                    video.currentTime = data.time;
                    if (data.isPlaying) video.play().catch(() => {}); else video.pause();
                }
            } else if (data.action === 'play') { if (!isAutonomous && currentHlsLink) video.play().catch(() => {}); } 
            else if (data.action === 'pause') { if (!isAutonomous) video.pause(); } 
            else if (data.action === 'admin_away') { isAutonomous = true; unlockViewerControls(); }
            else if (data.action === 'update_info') { updateInfo(data.title, data.desc, data.posterUrl); }
        });
        conn.on('close', () => { isAutonomous = true; unlockViewerControls(); });
        conn.on('error', () => { isAutonomous = true; unlockViewerControls(); });
    });
</script>
</body>
</html>
