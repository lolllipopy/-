<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Пизба 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  min-height: 100vh;
}
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* === Поиск (хост) === */
.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.search-box input {
  flex: 1;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #fff;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}
.search-box input:focus { border-color: #2563eb; }
.search-box button {
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.search-box button:active { opacity: 0.8; }

.results {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.result-item {
  background: #1a1a1a;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s;
}
.result-item:active { transform: scale(0.96); }
.result-item img {
  width: 100%;
  aspect-ratio: 2/3;
  max-height: 180px;
  object-fit: cover;
  display: block;
}
.result-item .info { padding: 8px; }
.result-item .title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* === Выбор озвучки и качества === */
.options-panel {
  background: #1a1a1a;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.options-panel h3 {
  font-size: 14px;
  margin-bottom: 10px;
  color: #888;
}
.option-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.option-row:last-child { margin-bottom: 0; }
.option-btn {
  background: #333;
  border: 1px solid #444;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.option-btn:hover { background: #444; }
.option-btn.selected {
  background: #2563eb;
  border-color: #2563eb;
}
.option-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* === Комната === */
.room-info {
  background: #1a1a1a;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.room-info h2 { font-size: 18px; margin-bottom: 8px; }
.room-link {
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
  word-break: break-all;
  color: #4ade80;
  cursor: pointer;
}
.room-link:active { background: #1a1a1a; }
.copy-hint { font-size: 12px; color: #666; margin-top: 6px; }

/* === Плеер === */
.player-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 12px;
}
#player {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

/* Оверлей поверх видео */
#click-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  cursor: pointer;
}
#click-overlay.hidden { display: none; }

/* Статус-оверлей */
#status-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
  z-index: 10;
  cursor: pointer;
  transition: opacity 0.3s;
}
#status-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.status-main {
  font-size: 18px;
  font-weight: 500;
  color: #fff;
  margin-bottom: 8px;
}
.status-sub {
  font-size: 14px;
  color: #888;
}

/* === Контролы === */
.controls-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #1a1a1a;
  border-radius: 12px;
}
.btn {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.85;
  transition: opacity 0.15s;
  flex-shrink: 0;
}
.btn:active { opacity: 1; background: rgba(255,255,255,0.08); }
.btn svg { width: 22px; height: 22px; fill: currentColor; }

/* Таймлайн */
.timeline-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.time {
  font-size: 12px;
  color: #888;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  white-space: nowrap;
}
.timeline {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: #333;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.timeline::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  cursor: pointer;
}
.timeline::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

/* Синхро-индикатор */
#sync-badge {
  font-size: 11px;
  color: #4ade80;
  background: rgba(74,222,128,0.1);
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
#sync-badge.off {
  color: #f87171;
  background: rgba(248,113,113,0.1);
}

/* Доп. контролы */
.extra-controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ХОСТ: Поиск -->
  <div id="host-panel">
    <h1 style="font-size:22px;margin-bottom:12px;">🎬 Создать комнату</h1>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Название фильма или сериала..." onkeypress="if(event.key==='Enter')search()">
      <button onclick="search()">Найти</button>
    </div>
    <div class="results" id="results"></div>

    <!-- Выбор озвучки и качества (хост) -->
    <div id="host-options" class="options-panel hidden">
      <h3>Озвучка</h3>
      <div class="option-row" id="translator-options"></div>
      <h3>Качество</h3>
      <div class="option-row" id="quality-options">
        <button class="option-btn selected" data-quality="1080p" onclick="selectQuality('1080p')">1080p</button>
        <button class="option-btn" data-quality="720p" onclick="selectQuality('720p')">720p</button>
        <button class="option-btn" data-quality="480p" onclick="selectQuality('480p')">480p</button>
      </div>
      <button onclick="startFilm()" style="width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;">▶ Запустить трансляцию</button>
    </div>

    <div id="room-created" class="hidden">
      <div class="room-info">
        <h2>✅ Комната создана</h2>
        <p style="color:#aaa;font-size:14px;margin-bottom:10px;">Отправь эту ссылку друзьям:</p>
        <div class="room-link" id="room-link" onclick="copyLink()"></div>
        <p class="copy-hint" id="copy-hint">Нажми чтобы скопировать</p>
      </div>
    </div>
  </div>

  <!-- ГОСТЬ: Ожидание -->
  <div id="guest-panel" class="hidden">
    <h1 style="font-size:22px;margin-bottom:12px;">📺 Комната <span id="room-id-display"></span></h1>
    <p style="color:#aaa;font-size:14px;margin-bottom:16px;">Ожидание хоста...</p>
  </div>

  <!-- Плеер -->
  <div class="player-box">
    <video id="player" playsinline webkit-playsinline muted preload="none" disablePictureInPicture></video>
    <div id="click-overlay"></div>
    <div id="status-overlay">
      <div class="status-main" id="status-main">Нажмите для подключения</div>
      <div class="status-sub" id="status-sub">Ожидание начала эфира</div>
    </div>
  </div>

  <!-- Контролы -->
  <div class="controls-bar" id="controls">
    <button class="btn" id="play-btn" title="Плей/Пауза">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div class="timeline-wrap">
      <span class="time" id="time-current">0:00</span>
      <input type="range" class="timeline" id="timeline" min="0" max="100" value="0" step="0.1">
      <span class="time" id="time-total">0:00</span>
    </div>
    <button class="btn" id="mute-btn" title="Звук">
      <svg id="icon-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 19L19 20.27 20.27 19 5.27 4 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      <svg id="icon-sound" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.02v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <button class="btn" id="fs-btn" title="Полный экран">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <span id="sync-badge">● LIVE</span>
  </div>

  <!-- Доп. контролы гостя -->
  <div class="extra-controls" id="guest-options">
    <button class="btn" id="translator-btn" title="Озвучка" style="font-size:12px;padding:6px 12px;">
      🎙 <span id="current-translator">Озвучка</span>
    </button>
    <button class="btn" id="quality-btn" title="Качество" style="font-size:12px;padding:6px 12px;">
      ⚙ <span id="current-quality">720p</span>
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
(function() {
  'use strict';

  const SERVER = 'https://pizba.onrender.com';
  const urlParams = new URLSearchParams(window.location.search);
  const ROOM_ID = urlParams.get('room');
  const IS_HOST = !ROOM_ID;

  // DOM
  const hostPanel = document.getElementById('host-panel');
  const guestPanel = document.getElementById('guest-panel');
  const hostOptions = document.getElementById('host-options');
  const translatorOptions = document.getElementById('translator-options');
  const roomLinkEl = document.getElementById('room-link');
  const roomCreated = document.getElementById('room-created');
  const roomIdDisplay = document.getElementById('room-id-display');
  const video = document.getElementById('player');
  const clickOverlay = document.getElementById('click-overlay');
  const statusOverlay = document.getElementById('status-overlay');
  const statusMain = document.getElementById('status-main');
  const statusSub = document.getElementById('status-sub');
  const playBtn = document.getElementById('play-btn');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  const timeline = document.getElementById('timeline');
  const timeCurrent = document.getElementById('time-current');
  const timeTotal = document.getElementById('time-total');
  const muteBtn = document.getElementById('mute-btn');
  const iconMuted = document.getElementById('icon-muted');
  const iconSound = document.getElementById('icon-sound');
  const fsBtn = document.getElementById('fs-btn');
  const syncBadge = document.getElementById('sync-badge');
  const guestOptions = document.getElementById('guest-options');
  const translatorBtn = document.getElementById('translator-btn');
  const qualityBtn = document.getElementById('quality-btn');
  const currentTranslator = document.getElementById('current-translator');
  const currentQuality = document.getElementById('current-quality');

  let roomId = ROOM_ID;
  let isHost = IS_HOST;
  let hasGesture = false;
  let currentUrl = '';
  let hls = null;
  let hostPingInterval = null;
  let lastState = null;
  let lastStateAt = 0;
  let wasUserPause = false;
  let isDraggingTimeline = false;
  let isLiveSync = true;

  let selectedFilm = null;
  let selectedTranslator = null;
  let selectedQuality = '720p';
  let availableTranslators = [];

  // ====== ИНИЦИАЛИЗАЦИЯ ======
  if (isHost) {
    hostPanel.classList.remove('hidden');
    syncBadge.classList.add('hidden');
    guestOptions.classList.add('hidden');
  } else {
    guestPanel.classList.remove('hidden');
    roomIdDisplay.textContent = roomId;
    connectAsGuest();
  }

  // ====== ПОИСК REZKA ======
  window.search = async function() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    const res = await fetch(`${SERVER}/api/rezka/search?q=${encodeURIComponent(q)}`);
    const films = await res.json();

    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = films.map(f => `
      <div class="result-item" onclick="selectFilm('${f.url}')">
        <img src="${f.poster}" alt="" onerror="this.style.display='none'">
        <div class="info">
          <div class="title">${f.title}</div>
        </div>
      </div>
    `).join('');
  };

  // ====== ВЫБОР ФИЛЬМА ======
  window.selectFilm = async function(filmUrl) {
    selectedFilm = filmUrl;

    const res = await fetch(`${SERVER}/api/rezka/info?url=${encodeURIComponent(filmUrl)}`);
    const info = await res.json();

    availableTranslators = info.translators || [{id: '1', name: 'Оригинал'}];
    selectedTranslator = availableTranslators[0];

    hostOptions.classList.remove('hidden');

    translatorOptions.innerHTML = availableTranslators.map((t, i) => `
      <button class="option-btn ${i === 0 ? 'selected' : ''}" data-translator="${t.id}" onclick="selectTranslator('${t.id}', '${t.name.replace(/'/g, "\\'")}')">${t.name}</button>
    `).join('');

    hostOptions.scrollIntoView({ behavior: 'smooth' });
  };

  window.selectTranslator = function(id, name) {
    selectedTranslator = { id, name };
    document.querySelectorAll('#translator-options .option-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.translator === id);
    });
  };

  window.selectQuality = function(q) {
    selectedQuality = q;
    document.querySelectorAll('#quality-options .option-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.quality === q);
    });
  };

  // ====== ЗАПУСК ТРАНСЛЯЦИИ ======
  window.startFilm = async function() {
    if (!selectedFilm || !selectedTranslator) return;

    const res = await fetch(`${SERVER}/api/rezka/stream?url=${encodeURIComponent(selectedFilm)}&translator=${selectedTranslator.id}&quality=${selectedQuality}`);
    const data = await res.json();

    const streamUrl = data.url;
    if (!streamUrl) {
      alert('Не удалось получить поток. Попробуйте другое качество или озвучку.');
      return;
    }

    const proxyUrl = `${SERVER}/api/rezka/proxy.m3u8?url=${encodeURIComponent(streamUrl)}`;

    const createRes = await fetch(`${SERVER}/api/room/create`, { method: 'POST' });
    const roomData = await createRes.json();
    roomId = roomData.roomId;

    const fullUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
    roomLinkEl.textContent = fullUrl;
    roomCreated.classList.remove('hidden');
    hostOptions.classList.add('hidden');

    isHost = true;
    currentUrl = proxyUrl;

    loadStream(proxyUrl, true);
    startHostSync(data.title || '', data.poster || '');
  };

  // ====== ХОСТ: СИНХРОНИЗАЦИЯ ======
  function startHostSync(title, poster) {
    postHost({ 
      url: currentUrl, 
      isPlaying: false, 
      time: 0, 
      title: title, 
      poster: poster,
      filmUrl: selectedFilm,
      translatorId: selectedTranslator.id,
      translatorName: selectedTranslator.name,
      quality: selectedQuality,
      action: 'change_src'
    });

    video.addEventListener('play', onHostPlay);
    video.addEventListener('pause', onHostPause);
    video.addEventListener('seeked', onHostSeek);

    hostPingInterval = setInterval(() => {
      postHost({ 
        time: video.currentTime, 
        isPlaying: !video.paused,
        action: 'ping'
      });
    }, 2000);
  }

  function onHostPlay() {
    postHost({ isPlaying: true, time: video.currentTime, action: 'play' });
    updatePlayIcon(true);
  }
  function onHostPause() {
    postHost({ isPlaying: false, time: video.currentTime, action: 'pause' });
    updatePlayIcon(false);
  }
  function onHostSeek() {
    postHost({ isPlaying: !video.paused, time: video.currentTime, action: 'seek' });
  }

  async function postHost(data) {
    if (!roomId) return;
    await fetch(`${SERVER}/api/room/${roomId}/host`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  }

  // ====== ГОСТЬ: ПОДКЛЮЧЕНИЕ ======
  function connectAsGuest() {
    const es = new EventSource(`${SERVER}/api/room/${roomId}/stream`);

    es.onmessage = function(e) {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          applyState(msg.data);
        }
      } catch(err) {}
    };

    es.onerror = function() {
      es.close();
      setTimeout(connectAsGuest, 3000);
    };
  }

  // ====== ГОСТЬ: СМЕНА ОЗВУЧКИ ======
  async function changeGuestTranslator(translatorId, translatorName) {
    if (!lastState || !lastState.filmUrl) return;

    currentTranslator.textContent = 'Загрузка...';

    const res = await fetch(`${SERVER}/api/rezka/stream?url=${encodeURIComponent(lastState.filmUrl)}&translator=${translatorId}&quality=${selectedQuality}`);
    const data = await res.json();

    if (data.url) {
      const proxyUrl = `${SERVER}/api/rezka/proxy.m3u8?url=${encodeURIComponent(data.url)}`;
      const currentTime = video.currentTime;

      loadStream(proxyUrl, !video.paused);

      video.addEventListener('canplay', function seek() {
        video.currentTime = currentTime;
        video.removeEventListener('canplay', seek);
      });

      currentTranslator.textContent = translatorName;
    }
  }

  // ====== ГОСТЬ: СМЕНА КАЧЕСТВА ======
  async function changeGuestQuality(quality) {
    if (!lastState || !lastState.filmUrl) return;

    currentQuality.textContent = '...';
    selectedQuality = quality;

    const translatorId = lastState.translatorId || '1';
    const res = await fetch(`${SERVER}/api/rezka/stream?url=${encodeURIComponent(lastState.filmUrl)}&translator=${translatorId}&quality=${quality}`);
    const data = await res.json();

    if (data.url) {
      const proxyUrl = `${SERVER}/api/rezka/proxy.m3u8?url=${encodeURIComponent(data.url)}`;
      const currentTime = video.currentTime;

      loadStream(proxyUrl, !video.paused);

      video.addEventListener('canplay', function seek() {
        video.currentTime = currentTime;
        video.removeEventListener('canplay', seek);
      });

      currentQuality.textContent = quality;
    }
  }

  // ====== ПЛЕЕР ======
  function canPlayNativeHls() {
    const v = document.createElement('video');
    return v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl') !== '';
  }

  function destroyHls() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
  }

  function loadStream(url, autoplay) {
    if (!url) return;
    currentUrl = url;
    destroyHls();
    video.removeAttribute('src');
    video.load();

    if (canPlayNativeHls()) {
      video.src = url;
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else {
      video.src = url;
    }

    if (autoplay && hasGesture) {
      video.play().catch(() => {});
    }
  }

  // ====== ПРИМЕНЕНИЕ СОСТОЯНИЯ ======
  function applyState(s) {
    if (!s) return;
    lastState = s;
    lastStateAt = Date.now();

    const hostOnline = s.hostOnline !== false;
    if (!hostOnline) {
      syncBadge.textContent = '● Хост оффлайн';
      syncBadge.classList.add('off');
    } else {
      syncBadge.textContent = '● LIVE';
      syncBadge.classList.remove('off');
    }

    if (!s.url) {
      if (currentUrl) {
        video.pause();
        video.src = '';
        currentUrl = '';
        destroyHls();
        setStatus('Хост отключился', 'Ожидание переподключения');
        statusOverlay.classList.remove('hidden');
        clickOverlay.classList.add('hidden');
      }
      return;
    }

    if (s.translatorName) currentTranslator.textContent = s.translatorName;
    if (s.quality) currentQuality.textContent = s.quality;

    if (s.url !== currentUrl) {
      loadStream(s.url, s.isPlaying);
      if (s.time > 0) {
        video.addEventListener('canplay', function seek() {
          if (isFinite(s.time) && s.time > 0) video.currentTime = s.time;
          video.removeEventListener('canplay', seek);
        });
      }
      return;
    }

    if (hasGesture && isLiveSync && !wasUserPause) {
      if (s.isPlaying && video.paused) {
        video.play().catch(() => {});
      } else if (!s.isPlaying && !video.paused) {
        video.pause();
      }
    }

    if (isLiveSync && !isDraggingTimeline && s.isPlaying && !video.paused && s.time > 0) {
      const elapsed = (Date.now() - lastStateAt) / 1000;
      const serverTime = s.time + elapsed;
      const drift = video.currentTime - serverTime;
      if (Math.abs(drift) > 3) {
        video.currentTime = serverTime;
        video.playbackRate = 1;
      } else if (drift > 0.5) {
        video.playbackRate = 0.95;
      } else if (drift < -0.5) {
        video.playbackRate = 1.05;
      } else {
        video.playbackRate = 1;
      }
    }

    updatePlayIcon(s.isPlaying);
  }

  // ====== КОНТРОЛЫ ======
  playBtn.addEventListener('click', function() {
    if (!currentUrl) return;

    if (isHost) {
      if (video.paused) video.play();
      else video.pause();
    } else {
      if (video.paused) {
        wasUserPause = false;
        isLiveSync = true;
        syncBadge.textContent = '● LIVE';
        syncBadge.classList.remove('off');
        if (lastState && lastState.time > 0) {
          const elapsed = (Date.now() - lastStateAt) / 1000;
          video.currentTime = lastState.time + (lastState.isPlaying ? elapsed : 0);
        }
        video.play().catch(() => {});
      } else {
        wasUserPause = true;
        isLiveSync = false;
        syncBadge.textContent = '● ПАУЗА';
        syncBadge.classList.add('off');
        video.pause();
      }
    }
  });

  timeline.addEventListener('input', function() {
    if (!isHost && isLiveSync && lastState) {
      const elapsed = (Date.now() - lastStateAt) / 1000;
      const correct = lastState.time + (lastState.isPlaying ? elapsed : 0);
      video.currentTime = correct;
      timeline.value = (correct / video.duration) * 100 || 0;
    }
  });

  timeline.addEventListener('mousedown', function() { isDraggingTimeline = true; });
  timeline.addEventListener('mouseup', function() {
    isDraggingTimeline = false;
    if (!isHost && isLiveSync && lastState) {
      const elapsed = (Date.now() - lastStateAt) / 1000;
      const correct = lastState.time + (lastState.isPlaying ? elapsed : 0);
      video.currentTime = correct;
    }
  });

  timeline.addEventListener('change', function() {
    if (isHost && video.duration) {
      const time = (timeline.value / 100) * video.duration;
      video.currentTime = time;
    }
  });

  muteBtn.addEventListener('click', function() {
    video.muted = !video.muted;
    updateMuteIcon();
  });

  fsBtn.addEventListener('click', function() {
    const box = document.querySelector('.player-box');
    if (!document.fullscreenElement) {
      box.requestFullscreen?.() || box.webkitRequestFullscreen?.();
    } else {
      document.exitFullscreen?.() || document.webkitExitFullscreen?.();
    }
  });

  // Гость: выбор озвучки
  translatorBtn.addEventListener('click', async function() {
    if (!lastState || !lastState.filmUrl) return;

    const res = await fetch(`${SERVER}/api/rezka/info?url=${encodeURIComponent(lastState.filmUrl)}`);
    const info = await res.json();

    const translators = info.translators || [];
    const names = translators.map(t => t.name).join('\n');
    const choice = prompt(`Выберите озвучку (введите номер):\n${translators.map((t, i) => `${i+1}. ${t.name}`).join('\n')}`);

    if (choice) {
      const idx = parseInt(choice) - 1;
      if (idx >= 0 && idx < translators.length) {
        changeGuestTranslator(translators[idx].id, translators[idx].name);
      }
    }
  });

  // Гость: выбор качества
  qualityBtn.addEventListener('click', function() {
    const choice = prompt('Выберите качество:\n1. 1080p\n2. 720p\n3. 480p');
    const map = { '1': '1080p', '2': '720p', '3': '480p' };
    if (map[choice]) changeGuestQuality(map[choice]);
  });

  // Оверлей первого жеста
  statusOverlay.addEventListener('click', function() {
    if (hasGesture) return;
    hasGesture = true;
    clickOverlay.classList.remove('hidden');

    video.play().then(() => video.pause()).catch(() => {
      video.muted = true;
      updateMuteIcon();
      video.play().then(() => video.pause()).catch(()=>{});
    });
    setStatus('Подключено', 'Ожидание начала эфира');
  });

  // ====== UI ======
  function updatePlayIcon(playing) {
    iconPlay.style.display = playing ? 'none' : '';
    iconPause.style.display = playing ? '' : 'none';
  }

  function updateMuteIcon() {
    const muted = video.muted || video.volume === 0;
    iconMuted.style.display = muted ? '' : 'none';
    iconSound.style.display = muted ? 'none' : '';
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) return '0:00';
    const s = Math.floor(t), m = Math.floor(s / 60), h = Math.floor(m / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${(m%60).toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  function setStatus(main, sub) {
    statusMain.textContent = main;
    statusSub.textContent = sub || '';
  }

  video.addEventListener('timeupdate', function() {
    timeCurrent.textContent = fmt(video.currentTime);
    timeTotal.textContent = fmt(video.duration || 0);
    if (!isDraggingTimeline && video.duration) {
      timeline.value = (video.currentTime / video.duration) * 100;
    }
  });

  video.addEventListener('playing', function() {
    if (currentUrl) {
      statusOverlay.classList.add('hidden');
      updatePlayIcon(true);
    }
  });

  video.addEventListener('pause', function() { updatePlayIcon(false); });

  video.addEventListener('waiting', function() {
    if (currentUrl) {
      setStatus('Буферизация...', '');
      statusOverlay.classList.remove('hidden');
    }
  });

  video.addEventListener('canplay', function() {
    if (currentUrl && !video.paused) {
      statusOverlay.classList.add('hidden');
    }
  });

  clickOverlay.addEventListener('click', function() {
    if (!hasGesture) {
      statusOverlay.click();
      return;
    }
    playBtn.click();
  });

  video.addEventListener('seeking', function() {
    if (isHost || !lastState || !lastState.isPlaying || !currentUrl) return;
    const elapsed = (Date.now() - lastStateAt) / 1000;
    const correct = lastState.time + (lastState.isPlaying ? elapsed : 0);
    if (Math.abs(video.currentTime - correct) > 2) video.currentTime = correct;
  });

  video.addEventListener('pause', function() {
    if (!isHost && lastState && lastState.isPlaying) wasUserPause = true;
  });

  video.addEventListener('play', function() {
    if (!isHost && wasUserPause && lastState) {
      wasUserPause = false;
      const elapsed = (Date.now() - lastStateAt) / 1000;
      video.currentTime = lastState.time + elapsed;
    }
  });

  window.copyLink = function() {
    const text = roomLinkEl.textContent;
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('copy-hint').textContent = '✅ Скопировано!';
      setTimeout(() => document.getElementById('copy-hint').textContent = 'Нажми чтобы скопировать', 2000);
    });
  };

  updateMuteIcon();

})();
</script>
</body>
</html>
