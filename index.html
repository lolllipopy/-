<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинозал</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;background-color:#000;overflow:hidden;font-family:sans-serif}
        .video-container{width:100%;height:100%;position:relative}
        .video-js{width:100%!important;height:100%!important}
        .click-blocker{position:absolute;top:0;left:0;width:100%;height:calc(100% - 50px);z-index:999;display:none}
        #admin-panel{position:absolute;top:15px;left:15px;background:rgba(20,20,20,.9);border:1px solid #333;color:#fff;padding:15px;border-radius:8px;z-index:1000;font-size:13px;width:320px;box-shadow:0 4px 20px rgba(0,0,0,.8)}

        #admin-panel button{background:#2563eb;color:#fff;border:none;padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:700}
        #admin-panel button:hover{background:#1d4ed8}
        .panel-section{margin-bottom:10px;border-bottom:1px solid #222;padding-bottom:10px}
    </style>
</head>
<body>
<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>

    let connections=[],currentHlsLink="",isAdmin=!1,ROOM_ID="";

    function lockViewerControls(){document.getElementById("blocker").style.display="block";if(player.controlBar.playToggle)player.controlBar.playToggle.hide();if(player.controlBar.progressControl)player.controlBar.progressControl.hide();window.addEventListener("keydown",preventSpace,!0)}
    function unlockViewerControls(){document.getElementById("blocker").style.display="none";if(player.controlBar.playToggle)player.controlBar.playToggle.show();if(player.controlBar.progressControl)player.controlBar.progressControl.show();window.removeEventListener("keydown",preventSpace,!0)}
    function preventSpace(e){if("Space"===e.code)e.preventDefault()}
    function createAdminPanel(){const e=document.createElement("div");e.id="admin-panel",e.innerHTML='<div class="panel-section"><strong>Панель Управления</strong></div><div class="panel-section"><label>1. Ссылка для зрителей:</label><input type="text" id="share-url" readonly onclick="this.select()"></div><div><label>2. Новая HLS (.m3u8) ссылка:</label><input type="text" id="hls-input" placeholder="Вставьте ссылку"><button onclick="changeStream()">Обновить поток у всех</button></div>',document.body.appendChild(e)}
    function changeStream(e,t=!1,n=!0){const o=e||document.getElementById("hls-input").value.trim();if(!o)return;currentHlsLink=o,player.src({src:o,type:"application/x-mpegURL"}),isAdmin&&!t?(player.play().catch((()=>{})),broadcast({action:"change_src",url:o,forcePlay:!0})):!isAdmin&&t&&(n?player.play().catch((()=>{})):player.pause())}
    function broadcast(e){connections.forEach((t=>{t.open&&t.send(e)}))}
    function startAdminLogic(){const e=new Peer(ROOM_ID);e.on("open",(()=>{document.getElementById("share-url").value=window.location.origin+window.location.pathname})),e.on("connection",(e=>{if(connections.length>=MAX_CONNECTIONS)return void e.close();connections.push(e);setInterval((()=>{e.open?e.send({action:"ping"}):clearInterval(p)}),1e3);setTimeout((()=>{if(currentHlsLink){const t=!player.paused();e.send({action:"sync_init",url:currentHlsLink,time:player.currentTime(),isPlaying:t})}}),1e3)})),player.on("play",(()=>{broadcast({action:"play"})})),player.on("pause",(()=>{broadcast({action:"pause"})})),player.on("seeked",(() => {broadcast({action:"seek_sync",time:player.currentTime(),isPlaying:!player.paused()})})),window.addEventListener("beforeunload",(()=>{broadcast({action:"admin_away"})}))}
    function startViewerLogic(){const e=new Peer;let t=Date.now(),n=!1;setInterval((()=>{currentHlsLink&&!n&&Date.now()-t>4e3&&(n=!0,unlockViewerControls())}),1e3),e.on("open",(e=>{const o=e.connect(ROOM_ID);o.on("data",(e=>{"ping"===e.action?(t=Date.now(),n&&(n=!1,lockViewerControls())):"sync_init"===e.action?(currentHlsLink=e.url,changeStream(e.url,!0,e.isPlaying),player.currentTime(e.time)):"seek_sync"===e.action?n||(player.currentTime(e.time),e.isPlaying?player.play().catch((()=>{})):player.pause()):"play"===e.action?!n&&currentHlsLink&&player.play().catch((()=>{})):"pause"===e.action?n||player.pause():"admin_away"===e.action&&(n=!0,unlockViewerControls())})),o.on("close",(()=>{n=!0,unlockViewerControls()})),o.on("error",(()=>{n=!0,unlockViewerControls()}))}))}
    initApp();
</script>
</body>
</html>
