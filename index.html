<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HLS Stream - Full Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; background: rgba(0,0,0,0); }
        #unmuteBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 18px; z-index: 20; cursor: pointer; border: none; border-radius: 8px;
            background: #fff; color: #000; font-weight: bold; display: block;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="blocker"></div>
    <button id="unmuteBtn">ВКЛЮЧИТЬ ЗВУК</button>
    <!-- Видео всегда muted по умолчанию для корректного автоплея -->
    <video id="video" playsinline muted></video>
</div>

<script>
// Настройки соединения
const ROOM_ID = 'pizba'; 

let hls;
let currentHlsLink = null;
let isAutonomous = true; 
let peerConn = null;
let lastPingTime = Date.now();

const video = document.getElementById('video');
const unmuteBtn = document.getElementById('unmuteBtn');

function lockViewerControls() { 
    document.getElementById('blocker').style.display = 'block'; 
    video.controls = false; 
}

function unlockViewerControls() { 
    document.getElementById('blocker').style.display = 'none'; 
    video.controls = true; 
}

// Управление звуком
unmuteBtn.addEventListener('click', () => { 
    video.muted = false; 
    video.volume = 1;
    unmuteBtn.style.display = 'none';
});

// Функция смены потока
function changeStream(url, forcePlay = true) { 
    currentHlsLink = url; 
    video.pause(); 

    if (hls) { 
        hls.destroy(); 
        hls = null; 
    } 

    video.removeAttribute('src'); 
    video.load();

    if (Hls.isSupported()) { 
        hls = new Hls({ debug: false, lowLatencyMode: true }); 
        hls.loadSource(url); 
        hls.attachMedia(video); 

        hls.on(Hls.Events.MANIFEST_PARSED, () => { 
            if (forcePlay) {
                video.play().catch(() => {
                    unmuteBtn.style.display = 'block';
                });
            }
        }); 

        hls.on(Hls.Events.ERROR, (event, data) => { 
            if (data.fatal) { 
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                else restartCurrentStream();
            } 
        }); 
    }
}

// Перезапуск только в автономном режиме [4]
function restartCurrentStream() { 
    if (!isAutonomous || !currentHlsLink) return; 
    changeStream(currentHlsLink, true);
}

// Контроль зависаний в автономном режиме [4]
setInterval(() => { 
    if (isAutonomous && currentHlsLink && !video.paused && video.readyState < 3) { 
        restartCurrentStream(); 
    } 
}, 10000);

// Инициализация связи через PeerJS [1]
lockViewerControls(); 
const peer = new Peer(); 

peer.on('open', () => { 
    peerConn = peer.connect(ROOM_ID, { reliable: true }); 
    
    peerConn.on('open', () => { 
        console.log('Связь с админом установлена'); 
    }); 

    // ИСПРАВЛЕННЫЙ ОБРАБОТЧИК КОМАНД
    peerConn.on('data', data => { 
        lastPingTime = Date.now(); 
        
        if (isAutonomous) { 
            isAutonomous = false; 
            lockViewerControls(); 
        }

        // Логика синхронизации: выполняем команды админа
        if (data.type === 'pause' || data.command === 'pause') {
            video.pause();
        } else if (data.type === 'play' || data.command === 'play') {
            video.play().catch(() => { unmuteBtn.style.display = 'block'; });
        } else if (data.url) {
            changeStream(data.url, true);
        }
    });
});

peer.on('error', () => { 
    isAutonomous = true; 
    unlockViewerControls(); 
    if (currentHlsLink) restartCurrentStream();
}); 

// Автоматический перезапуск при восстановлении сети [1]
window.addEventListener('online', () => { 
    if (currentHlsLink) changeStream(currentHlsLink, true); 
});
</script>
</body>
</html>
