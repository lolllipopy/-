<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинозал</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        .video-container { width: 100%; height: 100%; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        .click-blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); z-index: 999; display: none; }
        
        /* Стили панели (создается динамически только для админа) */
        #admin-panel {
            position: absolute; top: 15px; left: 15px; 
            background: rgba(20, 20, 20, 0.9); border: 1px solid #333;
            color: #fff; padding: 15px; border-radius: 8px; z-index: 1000; 
            font-size: 13px; width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        #admin-panel input { 
            width: 100%; background: #111; color: #fff; 
            border: 1px solid #444; padding: 6px; border-radius: 4px; 
            margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;
        }
        #admin-panel button {
            background: #2563eb; color: #fff; border: none; 
            padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #admin-panel button:hover { background: #1d4ed8; }
        .panel-section { margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="video-container">
    <div id="blocker" class="click-blocker"></div>
    <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered"></video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    // === НАСТРОЙКА БЕЗОПАСНОСТИ ===
    const PASSWORD_HASH = 'ab8bc76c9768cdc81da50bbbe5a6f886bb0c251e800bdd3cd9dacc49f15f19ba'; 
    const MAX_CONNECTIONS = 50; 

    // Хэширование SHA-256
    async function sha256(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Запуск Video.js
    const player = videojs('my-player', { 
        controls: true, 
        autoplay: false, 
        preload: 'auto',
        html5: {
            hls: {
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                backBufferLength: 15,
                maxBufferSize: 30 * 1024 * 1024
            }
        }
    });

    let connections = [];
    let currentHlsLink = "";
    let isAdmin = false;
    let ROOM_ID = "";

    async function initApp() {
        const urlParams = new URLSearchParams(window.location.search);
        const rawKey = urlParams.get('key') || '';
        
        const inputHash = rawKey ? await sha256(rawKey) : '';
        isAdmin = (inputHash === PASSWORD_HASH);

        ROOM_ID = 'room_' + PASSWORD_HASH.substring(0, 16);

        if (!isAdmin) {
            lockViewerControls();
            startViewerLogic();
        } else {
            createAdminPanel();
            startAdminLogic();
        }
    }

    function lockViewerControls() {
        document.getElementById('blocker').style.display = 'block';
        if (player.controlBar.playToggle) player.controlBar.playToggle.hide();
        if (player.controlBar.progressControl) player.controlBar.progressControl.hide();
        window.addEventListener('keydown', preventSpace, true);
    }

    function unlockViewerControls() {
        document.getElementById('blocker').style.display = 'none';
        if (player.controlBar.playToggle) player.controlBar.playToggle.show();
        if (player.controlBar.progressControl) player.controlBar.progressControl.show();
        window.removeEventListener('keydown', preventSpace, true);
    }

    function preventSpace(e) { if (e.code === 'Space') e.preventDefault(); }

    function createAdminPanel() {
        const panel = document.createElement('div');
        panel.id = 'admin-panel';
        panel.innerHTML = `
            <div class="panel-section"><strong>Панель Управления</strong></div>
            <div class="panel-section">
                <label>1. Ссылка для зрителей:</label>
                <input type="text" id="share-url" readonly onclick="this.select()">
            </div>
            <div>
                <label>2. Новая HLS (.m3u8) ссылка:</label>
                <input type="text" id="hls-input" placeholder="Вставьте ссылку">
                <button onclick="changeStream()">Обновить поток у всех</button>
            </div>
        `;
        document.body.appendChild(panel);
    }

    function changeStream(newUrl, isRemote = false, forcePlay = true) {
        const url = newUrl || document.getElementById('hls-input').value.trim();
        if (!url) return;

        currentHlsLink = url;
        player.src({ src: url, type: 'application/x-mpegURL' });
        
        if (isAdmin && !isRemote) {
            player.play().catch(() => {});
            broadcast({ action: 'change_src', url: url, forcePlay: true });
        } else if (!isAdmin && isRemote) {
            if (forcePlay) player.play().catch(() => {}); else player.pause();
        }
    }

    function broadcast(data) {
        connections.forEach(c => { if (c.open) c.send(data); });
    }

    // === ЛОГИКА АДМИНИСТРАТОРА ===
    function startAdminLogic() {
        const peer = new Peer(ROOM_ID);

        peer.on('open', () => {
            document.getElementById('share-url').value = window.location.origin + window.location.pathname;
        });

        peer.on('connection', conn => {
            if (connections.length >= MAX_CONNECTIONS) {
                conn.close();
                return;
            }

            connections.push(conn);
            
            const pingInterval = setInterval(() => {
                if (conn.open) { conn.send({ action: 'ping' }); } else { clearInterval(pingInterval); }
            }, 1000);

            setTimeout(() => {
                if (currentHlsLink) {
                    const isPlaying = !player.paused();
                    conn.send({ 
                        action: 'sync_init', 
                        url: currentHlsLink, 
                        time: player.currentTime(), 
                        isPlaying: isPlaying 
                    });
                }
            }, 1000);
        });

        player.on('play', () => { broadcast({ action: 'play' }); });
        player.on('pause', () => { broadcast({ action: 'pause' }); });
        
        player.on('seeked', () => {
            broadcast({ action: 'seek_sync', time: player.currentTime(), isPlaying: !player.paused() });
        });

        window.addEventListener('beforeunload', () => {
            broadcast({ action: 'admin_away' });
        });
    }

    // === ЛОГИКА ЗРИТЕЛЯ ===
    function startViewerLogic() {
        const peer = new Peer();
        let lastPingTime = Date.now();
        let isAutonomous = false;

        setInterval(() => {
            if (currentHlsLink && !isAutonomous && (Date.now() - lastPingTime > 4000)) {
                isAutonomous = true;
                unlockViewerControls(); 
            }
        }, 1000);

        peer.on('open', () => {
            const conn = peer.connect(ROOM_ID);
            
            conn.on('data', data => {
                if (data.action === 'ping') {
                    lastPingTime = Date.now();
                    if (isAutonomous) { isAutonomous = false; lockViewerControls(); }
                } 
                else if (data.action === 'sync_init') {
                    currentHlsLink = data.url;
                    changeStream(data.url, true, data.isPlaying);
                    player.currentTime(data.time);
                } 
                else if (data.action === 'seek_sync') {
                    if (!isAutonomous) {
                        player.currentTime(data.time);
                        if (data.isPlaying) player.play().catch(() => {}); else player.pause();
                    }
                } 
                else if (data.action === 'play') {
                    if (!isAutonomous && currentHlsLink) player.play().catch(() => {});
                } 
                else if (data.action === 'pause') {
                    if (!isAutonomous) player.pause();
                } 
                else if (data.action === 'admin_away') {
                    isAutonomous = true;
                    unlockViewerControls();
                }
            });

            conn.on('close', () => { isAutonomous = true; unlockViewerControls(); });
            conn.on('error', () => { isAutonomous = true; unlockViewerControls(); });
        });
    }

    initApp();
</script>

</body>
</html>
