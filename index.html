<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
        #unmuteBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; z-index: 20; cursor: pointer; background: #fff; border: none; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="blocker"></div>
    <button id="unmuteBtn">ВКЛЮЧИТЬ ЗВУК</button>
    <!-- Плеер обязан быть muted для автоматического старта -->
    <video id="video" playsinline muted></video>
</div>

<script>
// 1. Укажите ID вашей админки здесь
const ROOM_ID = 'pizba'; 

let hls;
let currentHlsLink = null;
let isAutonomous = true; 
let peerConn = null;

const video = document.getElementById('video');
const unmuteBtn = document.getElementById('unmuteBtn');

// Блокировка/разблокировка управления из ваших источников [2]
function lockViewerControls() { document.getElementById('blocker').style.display = 'block'; video.controls = false; }
function unlockViewerControls() { document.getElementById('blocker').style.display = 'none'; video.controls = true; }

// Включение звука [2]
unmuteBtn.addEventListener('click', () => { 
    video.muted = false; 
    video.volume = 1;
    unmuteBtn.style.display = 'none';
});

// Основная функция смены потока с очисткой памяти [2, 3]
function changeStream(url, forcePlay = true) { 
    currentHlsLink = url; 
    video.pause(); 

    if (hls) { 
        hls.destroy(); // 🔹 Предотвращаем утечки памяти
        hls = null; 
    } 

    video.removeAttribute('src'); 
    video.load();

    if (Hls.isSupported()) { 
        hls = new Hls({ debug: false, lowLatencyMode: true }); 
        hls.loadSource(url); 
        hls.attachMedia(video); 

        hls.on(Hls.Events.MANIFEST_PARSED, () => { 
            if (forcePlay) {
                video.play().catch(() => {
                    unmuteBtn.style.display = 'block'; // Показываем кнопку, если автоплей заблокирован
                });
            }
        }); 

        hls.on(Hls.Events.ERROR, (event, data) => { 
            if (data.fatal) { 
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                else restartCurrentStream();
            } 
        }); 
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => { if (forcePlay) video.play(); }, { once: true });
    }
}

// Перезапуск (заполняем пустую функцию из источника [4])
function restartCurrentStream() { 
    if (!isAutonomous || !currentHlsLink) return; 
    changeStream(currentHlsLink, true);
}

// Контроль зависаний [4]
setInterval(() => { 
    if (isAutonomous && currentHlsLink && !video.paused && video.readyState < 3) { 
        restartCurrentStream(); 
    } 
}, 10000);

// Инициализация PeerJS [1]
lockViewerControls(); 
const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } }); 

peer.on('open', () => { 
    peerConn = peer.connect(ROOM_ID, { reliable: true }); 
    
    peerConn.on('open', () => { console.log('Connected to admin'); }); 

    // 🔹 ВОТ ЗДЕСЬ ИСПРАВЛЕНА СИНХРОНИЗАЦИЯ
    peerConn.on('data', data => { 
        if (isAutonomous) { 
            isAutonomous = false; 
            lockViewerControls(); 
        }

        // Если админ прислал ссылку — меняем поток
        if (data.url) {
            changeStream(data.url);
        } 
        // Если админ нажал паузу/плей
        else if (data.command === 'pause' || data.type === 'pause') {
            video.pause();
        } 
        else if (data.command === 'play' || data.type === 'play') {
            video.play().catch(() => { unmuteBtn.style.display = 'block'; });
        }
    });
});

peer.on('error', () => { 
    isAutonomous = true; 
    unlockViewerControls(); 
    if (currentHlsLink) restartCurrentStream();
}); 

// Восстановление сети [1]
window.addEventListener('online', () => { 
    if (currentHlsLink) changeStream(currentHlsLink, true); 
});
</script>
</body>
</html>
